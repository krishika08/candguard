name: tests
"on":
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify default install has no optional dependencies
        shell: bash
        run: |
          python -c "import importlib.util, sys; sys.exit('pyarrow must not be installed by the default install' if importlib.util.find_spec('pyarrow') else 0)"
      - run: pytest --cov=candguard
      - name: Smoke test audit CLI
        run: candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --min-recall 0.60
      - name: Smoke test compare CLI
        run: |
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --format json --output base.json
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --format json --output curr.json
          candguard compare --baseline base.json --current curr.json --max-recall-drop 0.01 --max-pair-growth 0.05
      - name: Smoke test candidate-set drift CLI
        shell: bash
        run: |
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --candidate-set-out drift/base.pairs.tsv --format json --output drift/base.json
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --candidate-set-out drift/curr.pairs.tsv --format json --output drift/curr.json
          candguard compare --baseline drift/base.json --current drift/curr.json --baseline-candidate-set drift/base.pairs.tsv --current-candidate-set drift/curr.pairs.tsv --min-candidate-jaccard 1.0
          printf 'left_id\tright_id\nzz\ta\naa\tb\n' > drift/bad.pairs.tsv
          code=0
          candguard compare --baseline drift/base.json --current drift/curr.json --baseline-candidate-set drift/base.pairs.tsv --current-candidate-set drift/bad.pairs.tsv || code=$?
          test "$code" -eq 2
      - name: Verify package distribution build
        run: |
          pip install build
          python -m build
  test-parquet:
    name: optional parquet (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.10 resolves to PyArrow 25.x (26.x requires Python >= 3.11).
          - os: ubuntu-latest
            python-version: "3.10"
            expected-pyarrow-major: "25"
          - os: ubuntu-latest
            python-version: "3.13"
            expected-pyarrow-major: ""
          - os: windows-latest
            python-version: "3.12"
            expected-pyarrow-major: ""
          - os: macos-latest
            python-version: "3.12"
            expected-pyarrow-major: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,parquet]"
      - name: Report resolved PyArrow version
        shell: bash
        env:
          EXPECTED_MAJOR: ${{ matrix.expected-pyarrow-major }}
        run: |
          python - <<'PY'
          import os, sys, pyarrow
          major = int(pyarrow.__version__.split(".")[0])
          print(f"Python {sys.version.split()[0]} resolved pyarrow {pyarrow.__version__}")
          expected = os.environ.get("EXPECTED_MAJOR")
          if major < 25 or (expected and major != int(expected)):
              sys.exit(f"unexpected pyarrow version {pyarrow.__version__} (expected major {expected or '>=25'})")
          PY
      - run: pytest --cov=candguard
      - name: Smoke test audit CLI with Parquet inputs
        shell: bash
        run: |
          python - <<'PY'
          import csv, pyarrow as pa, pyarrow.parquet as pq
          for name in ("candidates", "truth"):
              with open(f"examples/{name}.tsv", encoding="utf-8", newline="") as stream:
                  rows = list(csv.reader(stream, delimiter="\t"))
              header, body = rows[0], rows[1:]
              pq.write_table(pa.table({col: [r[i] for r in body] for i, col in enumerate(header)}), f"{name}.parquet")
          PY
          candguard audit --candidates candidates.parquet --truth truth.parquet --left-id source_id --right-id candidate_id --min-recall 0.60
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --format json --output tsv.json
          candguard audit --candidates candidates.parquet --truth truth.parquet --left-id source_id --right-id candidate_id --format json --output parquet.json
          candguard compare --baseline tsv.json --current parquet.json --max-recall-drop 0 --max-pair-growth 0 --max-duplicate-growth 0
          candguard audit --candidates examples/candidates.tsv --left-id source_id --right-id candidate_id --candidate-set-out tsv.pairs.tsv --format json --output tsv-cs.json
          candguard audit --candidates candidates.parquet --left-id source_id --right-id candidate_id --candidate-set-out parquet.pairs.tsv --format json --output parquet-cs.json
          cmp tsv.pairs.tsv parquet.pairs.tsv
          candguard compare --baseline tsv-cs.json --current parquet-cs.json --baseline-candidate-set tsv.pairs.tsv --current-candidate-set parquet.pairs.tsv --min-candidate-jaccard 1.0

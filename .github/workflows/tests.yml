name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=candguard
      - name: Smoke test audit CLI
        run: candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --min-recall 0.60
      - name: Smoke test compare CLI
        run: |
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --format json --output base.json
          candguard audit --candidates examples/candidates.tsv --truth examples/truth.tsv --left-id source_id --right-id candidate_id --format json --output curr.json
          candguard compare --baseline base.json --current curr.json --max-recall-drop 0.01 --max-pair-growth 0.05
      - name: Verify package distribution build
        run: |
          pip install build
          python -m build

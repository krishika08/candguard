[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candguard"
version = "0.1.0rc1"
description = "A lightweight quality gate for entity-resolution candidate generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "CandGuard contributors" }]
keywords = ["entity-resolution", "record-linkage", "blocking", "candidate-generation", "data-quality", "cli"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/krishika08/candguard"
Repository = "https://github.com/krishika08/candguard"
Issues = "https://github.com/krishika08/candguard/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
candguard = "candguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
